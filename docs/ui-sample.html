<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>/yomimasu 画面の見本</title>
<style>
/* 値の意味は ui-guide.md に書く。録音は実際にはしない。音も出ない。 */
:root {
  --paper: #F6F2E9;
  --card: #FFFDF9;
  --ink: #201D19;
  --ink-2: #4B453B;
  --ink-3: #655D50;
  --rule: #D9D0BF;
  --rule-2: #E7E0D2;
  --track: #ECE6D8;
  --shu: #B23A1C;
  --shu-deep: #9C3014;
  --shu-soft: #FAEBE3;
  --on-shu: #FFFDF9;
  --seg-shimo: #B8DCB2;
  --seg-yoin: #F6D56E;
  --seg-yoin-fade: #FBF0C6;
  --seg-ma: #F3B283;
  --seg-kami: #A6C2EC;

  --f-sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --f-serif: "Hiragino Mincho ProN", "Noto Serif CJK JP", "Noto Serif JP", "Yu Mincho", serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
  --f-uta: "yomimasu-uta", var(--f-serif);

  --gutter: 16px;
  --column: 34rem;
  --lyric: clamp(18px, min(6vw, 3.6svh), 26px);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-sans); font-size: 16px; line-height: 1.8; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--shu); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { width: 100%; max-width: var(--column); margin-inline: auto; padding-inline: var(--gutter); min-height: 100svh; display: flex; flex-direction: column; }
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-family: var(--f-mono); font-size: 14px; }
.bar a { font-weight: 600; text-decoration: none; padding-block: 10px; }
.bar .step { color: var(--ink-3); font-size: 13px; }
.bar .rec-state { color: var(--shu-deep); font-weight: 600; }
.bar .rec-state::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; background: var(--shu); }
main { flex: 1 1 auto; display: flex; flex-direction: column; padding-bottom: 16px; }
.screen { flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; }

/* 実行の行 */
.run { font-family: var(--f-mono); font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
.run .gt { color: var(--shu); }
.run .read { color: var(--ink-3); }
.reveal { opacity: 0; }
/* 上から1つずつ出すあいだ、順番が来ていない要素は場所も取らない。ターミナルの出力が下へ伸びていくのと同じ見え方にする */
.pending { display: none !important; }
/* 導入の段の切り替えでは、場所だけ先に取っておく。下の歌の枠が、文の伸び縮みで上下に揺れないようにする */
.reserved, .ghost { visibility: hidden !important; }
.fade-in { animation: fade-in 0.15s ease-out both; }
@keyframes fade-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* 入力の行 */
.ask { display: grid; gap: 8px; margin-top: auto; padding-top: 8px; }
.ask-line { font-family: var(--f-mono); font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
.ask-line .gt { color: var(--shu); }
.caret { display: inline-block; width: 8px; height: 1.1em; margin-left: 2px; vertical-align: text-bottom; background: var(--ink); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ask-q { font-size: 14px; color: var(--ink-3); }
.next { display: flex; flex-wrap: wrap; gap: 8px; }
.next > * { flex: 1 1 40%; min-width: 0; }
.next > .btn--fill { flex-basis: 100%; }
.ask.is-sent .next, .ask.is-sent .ask-q { opacity: 0.45; }
.ask.is-sent .menu { opacity: 0.45; }

/* 戻る：主の操作の右に細く置く。押すと行き先を尋ねる */
/* 主の操作を押すつもりで戻るに触れないよう、間を少し広く取る */
.main-row { display: flex; gap: 12px; }
.next > .main-row, .next > .auq { flex-basis: 100%; }
.main-row > .btn--fill { flex: 1 1 auto; min-width: 0; }
.btn.back { flex: none; width: 76px; }
.back-row { display: flex; justify-content: flex-end; }
/* 質問（AskUserQuestion の形）。主のボタン群と入れ替えて出す */
.auq { display: grid; gap: 6px; width: 100%; flex: 1 1 100%; }
.auq-q { font-family: var(--f-mono); font-size: 14px; font-weight: 600; line-height: 1.7; }
.auq-q::before { content: "? "; color: var(--shu); }
.auq-a { font-family: var(--f-mono); font-size: 14px; line-height: 1.7; color: var(--ink-3); }
.auq-opts { display: grid; gap: 6px; }
.auq-opts .btn { justify-content: flex-start; text-align: left; }

/* ボタン */
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--ink); background: var(--card); color: var(--ink); font-size: 15px; line-height: 1.4; text-align: center; text-decoration: none; cursor: pointer; }
.btn--fill { background: var(--shu); border-color: var(--shu); color: var(--on-shu); font-weight: 700; }
.btn--line { background: transparent; border-color: var(--rule); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { color: var(--ink-3); border-color: var(--rule-2); background: transparent; cursor: default; }
.btn[aria-pressed="false"] { background: transparent; border-color: var(--rule); }
.btn[aria-pressed="true"] { border-width: 2px; font-weight: 700; }
.pair { display: flex; gap: 8px; }
.pair > * { flex: 1 1 0; min-width: 0; }
.link { color: var(--ink-2); font-size: 14px; }
.ico { width: 12px; height: 12px; flex: none; fill: currentColor; }

/* カードと行 */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
.rows > * + * { border-top: 1px solid var(--rule-2); }
.prio { display: block; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.prio--hi { color: var(--shu-deep); }
small, .fine { font-size: 13px; line-height: 1.7; color: var(--ink-3); }

/* 入口 */
.hero { display: grid; gap: 8px; padding-block: 20px 16px; }
.hero h1 { font-family: var(--f-serif); font-weight: 700; font-size: 30px; line-height: 1.4; }
.hero p { color: var(--ink-2); }
.menu { display: grid; overflow: hidden; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; font-family: var(--f-mono); }
.menu a { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 6px 14px; text-decoration: none; font-size: 15px; }
.menu a + a { border-top: 1px solid var(--rule-2); }
.menu small { font-family: var(--f-sans); text-align: right; min-width: 0; }
/* コマンド名は折り返さない。狭い画面では添え書きの側を折り返す */
.menu span { white-space: nowrap; }
.menu .first { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; min-height: 64px; background: var(--shu); color: var(--on-shu); font-size: 17px; font-weight: 600; }
.menu .first small { color: inherit; text-align: left; }

/* 教科書 */
.head { font-family: var(--f-serif); font-weight: 700; font-size: 24px; line-height: 1.45; }
.big-num { font-family: var(--f-mono); font-size: 30px; font-weight: 600; line-height: 1.3; }
.list > div { display: grid; grid-template-columns: 34px minmax(0, 1fr); padding: 12px 14px; }
.list .n { font-family: var(--f-mono); font-size: 22px; font-weight: 600; line-height: 1.3; color: var(--shu-deep); }
.list b { display: block; line-height: 1.5; }
.list p { font-size: 15px; line-height: 1.7; color: var(--ink-2); }
.trap { padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 4px 10px; }
.trap b { line-height: 1.55; text-wrap: balance; }
.trap p { grid-column: 1 / -1; font-size: 15px; line-height: 1.7; color: var(--ink-2); }
.play { width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; }
.more > div { padding: 10px 14px; font-size: 15px; line-height: 1.6; }
.kim-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.kim-grid a, .kim-grid span { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 56px; padding: 4px; border-radius: 8px; border: 1px solid var(--rule-2); text-decoration: none; color: var(--ink-3); }
.kim-grid a { border-color: var(--ink); background: var(--card); color: var(--ink); }
.kim-grid b { font-family: var(--f-uta); font-weight: 400; font-synthesis: none; font-size: 18px; line-height: 1.35; }
.kim-grid small { font-family: var(--f-mono); font-size: 12px; line-height: 1.2; }
.kim-grid .joka { grid-column: span 3; }
.group-head { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 4px; font-size: 16px; }
.group-head b { font-family: var(--f-uta); font-weight: 400; font-synthesis: none; font-size: 22px; color: var(--shu-deep); }

/* 1首の縦書き */
/* アプリは切り出した版を配信する。見本は端末にある場合だけ使う */
@font-face { font-family: "yomimasu-uta"; src: local("はんなり明朝"), local("HannariMincho-Regular"), local("Hannari Mincho"); }
.tate { writing-mode: vertical-rl; font-family: var(--f-uta); font-weight: 400; font-synthesis: none; font-size: var(--lyric); line-height: 1.6; letter-spacing: 0.05em; }
/* Safari は flex の子の縦書きを最小の高さで折り返し、1字ずつの列に崩す */
.tate .ln { white-space: nowrap; }
.tate .ln.break { margin-block-start: 0.7em; }
.nobi { color: var(--shu); }
.tate rt { font-family: var(--f-sans); font-size: 0.42em; letter-spacing: 0; color: var(--ink-3); }
/* ▼ の字は書体で形が変わり、縦に伸ばせないので、形を描く。
   中に全角の空白を入れて字と同じ基準線に乗せる。空の箱は行の幅の中央に寄り、ふりがなのぶん右へずれる */
.yoin { display: inline-block; width: 1em; height: 1.5em; margin-top: 0.2em; line-height: 1; color: transparent; background: var(--shu); clip-path: polygon(25% 0, 75% 0, 50% 100%); }
.kimari { color: var(--shu-deep); }
.poem { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 8px; padding: 16px 14px; }
.poem .tate { justify-self: center; --lyric: clamp(22px, 6.4vw, 28px); }
.poem aside { display: flex; flex-direction: column; justify-content: space-between; text-align: right; }
.poem .kim { font-family: var(--f-uta); font-size: 19px; font-weight: 400; font-synthesis: none; color: var(--shu-deep); }
.kim-in { font-family: var(--f-uta); font-weight: 400; font-synthesis: none; color: var(--shu-deep); }

/* 帯 */
.band { display: flex; gap: 2px; height: 34px; }
.seg { position: relative; min-width: 0; overflow: hidden; border-radius: 4px; background: var(--track); }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; }
.seg span { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12.5px; line-height: 1.2; white-space: nowrap; }
.seg span small { font-family: var(--f-mono); font-size: inherit; line-height: inherit; color: inherit; font-variant-numeric: tabular-nums; }
.seg.is-now { box-shadow: inset 0 0 0 2px var(--ink); }
[data-seg="shimo"] { --seg: var(--seg-shimo); }
[data-seg="yoin"] { --seg: var(--seg-yoin); }
[data-seg="ma"] { --seg: var(--seg-ma); }
[data-seg="kami"] { --seg: var(--seg-kami); }
.seg i, .drain { background: var(--seg); }
.band--static .seg { background: var(--seg); }
.band--tall { height: 44px; }
.band--tall .seg span { font-size: 13.5px; }

/* 歌詞と帯をまとめた枠 */
.stage { flex: 1 1 auto; min-height: 300px; max-height: 640px; display: flex; flex-direction: column; gap: 8px; padding: 8px; }
.stage-body { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; border-radius: 8px; background: var(--track); }
.drain { position: absolute; inset: 0; transform-origin: bottom; }
.now { position: absolute; inset: 8px 12px auto 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.now b { font-family: var(--f-serif); font-size: 17px; line-height: 1.5; }
.now span { font-family: var(--f-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.5; white-space: nowrap; }
.now span small { font-family: var(--f-sans); font-size: 13px; font-weight: 700; }
.lyric { position: absolute; inset: 44px 44px 10px 10px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--card); }
.lyric .tate { color: var(--ink); }
.lyric .on { color: var(--shu); }
.count { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; background: rgba(32, 29, 25, 0.78); color: var(--card); font-family: var(--f-mono); font-size: 92px; font-weight: 600; }
.stage[data-assist="off"] .drain, .stage[data-assist="off"] .seg i, .stage[data-assist="off"] .now span { display: none; }
/* 余韻で押す字の目印。読む画面の補助ありのときだけ出す */
.stage[data-tap]:not([data-assist="off"]) .cue { -webkit-text-emphasis: filled circle var(--shu-deep); text-emphasis: filled circle var(--shu-deep); }
.tap-hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 4px 12px; border-radius: 999px; background: var(--ink); color: var(--card); font-size: 14px; font-weight: 600; white-space: nowrap; pointer-events: none; }
/* 読む前の説明。枠の上に重ねて、読む画面の高さを増やさない */
.rec-help { position: absolute; inset: 0; z-index: 3; overflow: auto; padding: 14px; display: grid; align-content: start; gap: 8px; background: var(--card); font-size: 14px; line-height: 1.65; }
.rec-help b { font-family: var(--f-serif); font-size: 17px; }
.rec-help p::before { content: "● "; color: var(--shu); }
.rec-help .btn { justify-self: start; min-height: 44px; }
.link-inline { padding: 0; border: 0; background: none; color: var(--ink-2); font-size: inherit; text-decoration: underline; cursor: pointer; }
.stage[data-assist="off"] .seg.is-now { box-shadow: none; }

.screen--stage { gap: 10px; }
/* 導入の1行。Claude Code の出力のように ● を付ける */
.say { font-size: 16px; line-height: 1.75; }
.say::before { content: "● "; color: var(--shu); }
.intro-points { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 15px; line-height: 1.6; }
.intro-points b { color: var(--shu-deep); }
/* 導入の段2で、説明している仕組みを枠で囲んで番号を付ける */
.is-marked { position: relative; outline: 3px solid var(--shu); outline-offset: 2px; border-radius: 6px; }
.is-marked::after { content: attr(data-mark); position: absolute; z-index: 4; width: 22px; height: 22px; border-radius: 50%; background: var(--shu); color: var(--on-shu); font: 700 13px/22px var(--f-mono); text-align: center; }
.band.is-marked::after { top: -12px; left: -12px; }
.stage-body.is-marked::after { bottom: 8px; left: 8px; }
.intro-rule { display: grid; gap: 12px; padding-block: 8px; }
.link-btn { justify-self: start; min-height: 44px; padding: 0; border: 0; background: none; color: var(--ink-2); font-size: 14px; text-decoration: underline; cursor: pointer; }
.controls { flex: none; display: grid; align-content: start; gap: 6px; min-height: 150px; }
.fix-chip { padding: 2px 10px; border-radius: 8px; background: var(--shu-soft); color: var(--shu-deep); font-size: 14px; font-weight: 700; line-height: 1.6; }
.alert { padding: 12px 14px; display: grid; gap: 8px; }
.alert b { line-height: 1.6; }

/* 結果 */
.res > div { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 8px 14px; }
.res .k { display: block; line-height: 1.5; }
.res .v { flex: none; text-align: right; font-size: 14px; line-height: 1.5; }
.res .v b { display: block; font-family: var(--f-mono); font-size: 20px; font-weight: 600; line-height: 1.3; }
.res .is-hot { background: var(--shu-soft); }
.res .is-hot .v { color: var(--shu-deep); font-weight: 700; }
.one { display: grid; gap: 4px; padding: 14px; border-color: var(--ink); }
.one .l { font-size: 13px; font-weight: 700; color: var(--shu-deep); }
.one .t { font-family: var(--f-serif); font-size: 22px; font-weight: 700; line-height: 1.45; }
.one p { font-size: 15px; line-height: 1.75; color: var(--ink-2); }
.tag { align-self: flex-start; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--ink); font-size: 13px; }

/* 見本だけの切り替え。アプリには作らない */
.only-sample { width: calc(100% - 2 * var(--gutter)); max-width: calc(var(--column) - 2 * var(--gutter)); margin: 0 auto 24px; padding: 10px 12px; border: 1px dashed var(--ink-3); border-radius: 8px; display: grid; gap: 8px; font-size: 13px; color: var(--ink-3); }
.only-sample div { display: flex; flex-wrap: wrap; gap: 6px; }
.only-sample button { min-height: 36px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--ink-3); background: transparent; cursor: pointer; }

/* 一覧の最後の項目と取り違えて押さないよう、一覧から離す */
.footnote { padding-top: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.foot-link { display: inline-flex; align-items: center; min-height: 44px; padding-inline: 4px; font-family: var(--f-mono); color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) {
  .caret { animation: none; }
  .fade-in { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a href="#/">/yomimasu</a>
    <span class="step" id="step"></span>
  </header>
  <main id="out"></main>
</div>
<aside class="only-sample" id="tools" hidden></aside>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 12 12"><path d="M2 2h8v8H2z"/></symbol>
  <symbol id="i-rec" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5"/></symbol>
</svg>

<template id="t-home">
  <section class="hero">
    <h1>「読みます」と<br>言うために。</h1>
    <p>すべての人に、読みを身近に。</p>
  </section>
  <section class="ask" data-ask>
    <div class="ask-line"><span class="gt">&gt;</span> <span data-typed>/yomimasu </span><span class="caret"></span></div>
    <nav class="menu" aria-label="やれること">
      <a class="first" href="#/read/"><small>はじめての人はここから</small><span>/まず1回読む</span></a>
      <a href="#/soron/"><span>/総論を学ぶ</span><small>5-3-1-6 の配分</small></a>
      <a href="#/point/"><span>/ポイントを知る</span></a>
      <a href="#/karuta/"><span>/1首ずつ学ぶ</span><small>100首と序歌</small></a>
      <a href="#/saitei/"><span>/最低限これだけ</span><small>急に頼まれたら</small></a>
      <a href="#/practice/"><span>/練習モード</span><small>読んで、秒数を測る</small></a>
    </nav>
  </section>
  <p class="fine footnote"><span lang="en">Built with Claude Code.</span><a class="foot-link" href="#/about/">/このアプリについて</a></p>
</template>

<template id="t-about">
  <h2 class="head">このアプリについて</h2>
  <div class="card rows more">
    <div><b style="display:block;line-height:1.5">個人の制作物です</b><p style="color:var(--ink-2);line-height:1.7">全日本かるた協会の公認ではなく、Anthropic の製品でもありません。</p></div>
    <div><b style="display:block;line-height:1.5">読み方の決まり</b><p style="color:var(--ink-2);line-height:1.7">全日本かるた協会『小倉百人一首 競技かるた読手テキスト』をもとに、自分の言葉で書いています。本文は転載していません。</p></div>

<script>
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const out = document.getElementById('out');
const stepEl = document.getElementById('step');
const COMMAND = '/yomimasu ';

const TYPE_MS = 280;
const SEND_HOLD_MS = 90;
const REVEAL_STEP_MS = 110;

const ROUTES = {
  '/': { tpl: 't-home' },
  '/soron/': { tpl: 't-soron', cmd: '総論を学ぶ', read: '総論.md', mount: mountSoron },
  '/saitei/': { tpl: 't-saitei', cmd: '最低限これだけ', read: '最低限これだけ.md' },
  '/point/': { tpl: 't-trap', cmd: 'ポイントを知る', read: 'ポイント.md' },
  '/karuta/': { tpl: 't-karuta-list', cmd: '1首ずつ学ぶ', read: '一覧.md', mount: mountGrid },
  '/karuta/53/': { tpl: 't-karuta', cmd: '1首 なげき', read: 'なげき.md', mount: (el) => mountPoem(el, 53) },
  '/practice/': { tpl: 't-practice', cmd: '練習モード' },
  '/about/': { tpl: 't-about', cmd: 'このアプリについて', read: 'このアプリについて.md' },
  '/read/': { tpl: 't-listen', cmd: 'まず1回読む', step: '1 / 3 聞く', full: true, mount: mountListen },
  '/read/rec/': { tpl: 't-rec', cmd: '読む ほ あはれ', step: '2 / 3 読む', full: true, mount: mountRec },
  '/read/heard/': { tpl: 't-heard', cmd: '読む ほ あはれ', note: '録音しました', step: '3 / 3 確かめる' },
  '/result/': { tpl: 't-result', cmd: '結果を見る', step: '補助あり', mount: mountResult },
};

const SEGMENTS = [
  { key: 'shimo', name: '下の句', sec: 5, label: '下の句（5秒程度）' },
  { key: 'yoin', name: '余韻', sec: 3, label: '余韻（3.0秒）' },
  { key: 'ma', name: '間', sec: 1, label: '間（1.0秒）' },
  { key: 'kami', name: '上の句', sec: 6, label: '上の句（6秒程度）' },
];
const PAIR_SEC = SEGMENTS.reduce((sum, s) => sum + s.sec, 0);

// 余韻の最後の1秒は、声を弱め始めてよい範囲として地の色を薄くしていく（2026-11-03 のユーザーの判断）
const FADE_SEC = 1;

// 間は1秒しかなく、区間ごとに名前と色を替えると目で追えないので、余韻と間を1つの区間として見せる
const PHASES = [
  { keys: ['shimo'], key: 'shimo', label: '下の句（5秒程度）' },
  { keys: ['yoin', 'ma'], key: 'yoin', label: '余韻と間（3.0＋1.0秒）' },
  { keys: ['kami'], key: 'kami', label: '上の句（6秒程度）' },
].map((p) => {
  const segs = SEGMENTS.filter((s) => p.keys.includes(s.key));
  const sec = segs.reduce((sum, s) => sum + s.sec, 0);
  // 地は上から減るので、先に来る区間の色を上に置く。余韻の色が減りきると間の色だけが残り、境目が見える
  let at = 0;
  const pct = (x) => `${(x / sec) * 100}%`;
  const stops = segs.map((s) => {
    const from = at;
    at += s.sec;
    if (s.key === 'yoin') return `var(--seg-yoin) ${pct(from)} ${pct(at - FADE_SEC)}, var(--seg-yoin-fade) ${pct(at)}`;
    return `var(--seg-${s.key}) ${pct(from)} ${pct(at)}`;
  });
  return { ...p, sec, fill: segs.length === 1 ? `var(--seg-${segs[0].key})` : `linear-gradient(to bottom, ${stops.join(', ')})` };
});

function phaseAt(t) {
  let from = 0;
  for (const p of PHASES) {
    if (t < from + p.sec) return { phase: p, from };
    from += p.sec;
  }
  const last = PHASES.at(-1);
  return { phase: last, from: PAIR_SEC - last.sec };
}

// ふりがなは札の読みの表の読み（sound）から振った。余韻の印は下の句の最後の行に付ける。
// [文字, 重み] の重みは読みの長さの仮の値で、C3 の本物の時刻ではない。
const CARDS = {
  53: { kim: 'なげき', kami: ['[{嘆|なげ}き]つつー', 'ひとり{寝|ぬ}る{夜|よ}のー', '{明|あ}くる{間|ま}ー{は|わ}ー'], shimo: ['いかにー{久|ひさ}しきー', 'ものとか{は|わ}ー{知|し}る'],
    care: [['優先 高', '札ごとの注意点の題', '札ごとの注意点の本文が入ります。この文は仮の文です。']] },
};
const LYRICS = [
  // 81番の下の句と45番の上の句（5-3-1-6 に最も近いお手本の組）。伸ばす位置とふりがなは札の読みの表から取った
  { at: 0, to: 2.3, chars: [['た'], ['だ'], ['ー', 2], ['有', 2, 'あり'], ['明', 2, 'あけ'], ['の'], ['ー', 2]] },
  { at: 2.3, to: 5, yoin: true, chars: [['月', 2, 'つき'], ['ぞ'], ['残', 2, 'のこ'], ['ー', 2], ['れ'], ['る', 1, null, true]] },
  { at: 9, to: 10.6, brk: true, chars: [['あ'], ['は', 1, 'わ'], ['れ'], ['と'], ['も'], ['ー', 2]] },
  { at: 10.6, to: 12.6, chars: [['い', 1, 'ゆ'], ['ふ', 1, 'う'], ['べ'], ['き'], ['人', 2, 'ひと'], ['は', 1, 'わ'], ['ー', 2]] },
  { at: 12.6, to: 15, chars: [['思', 2, 'おも'], ['ほ', 1, 'お'], ['え'], ['ー', 2], ['で'], ['ー', 2]] },
];

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const clone = (id) => document.getElementById(id).content.cloneNode(true);
const nobiHtml = (text) => text.replace(/ー/g, '<span class="nobi">ー</span>');
const YOIN = '<span class="yoin" role="img" aria-label="余韻">　</span>';
// 1首のページの歌の書き方：[ ] は決まり字、{字|読み} は実際の発音のふりがな、ー は伸ばす印
const verseHtml = (text) => nobiHtml(text)
  .replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>')
  .replace(/\[/g, '<span class="kimari">')
  .replace(/\]/g, '</span>');

let disposers = [];
const onDispose = (fn) => disposers.push(fn);
function disposeAll() { disposers.forEach((fn) => fn()); disposers = []; }

function buildBand(root, { fixed = false } = {}) {
  root.setAttribute('role', 'img');
  root.setAttribute('aria-label', SEGMENTS.map((s) => `${s.name} ${s.sec}秒`).join('、'));
  root.innerHTML = SEGMENTS.map((s) =>
    `<div class="seg" data-seg="${s.key}" style="flex:${s.sec} 1 0" aria-hidden="true"><i></i><span>${s.name}<small>${s.sec}</small></span></div>`).join('');
  if (fixed) root.classList.add('band--static');
}

function paintBand(root, t) {
  const inPair = t >= 0 && t < PAIR_SEC;
  const { phase } = phaseAt(t);
  let cursor = 0;
  root.querySelectorAll('.seg').forEach((el, i) => {
    const s = SEGMENTS[i];
    const from = cursor;
    cursor += s.sec;
    el.querySelector('i').style.width = `${Math.min(Math.max((t - from) / s.sec, 0), 1) * 100}%`;
    el.classList.toggle('is-now', inPair && phase.keys.includes(s.key));
  });
}

function buildStage(root) {
  root.innerHTML = `<div class="band" data-band></div>
    <div class="stage-body">
      <div class="drain"></div>
      <div class="now"><b></b><span></span></div>
      <div class="lyric"><div class="tate">${LYRICS.map(lineHtml).join('')}</div></div>
      <div class="count" hidden></div>
    </div>`;
  buildBand(root.querySelector('[data-band]'));
  paintStage(root, Number(root.dataset.t));
  const box = root.querySelector('.lyric');
  const observer = new ResizeObserver(() => fitLyric(box));
  observer.observe(box);
  onDisposeLong(() => observer.disconnect());
}

// 歌は枠に合わせて縮める。余韻の印やふりがなで行が伸びると、狭い画面で枠の上下にはみ出すからである
function fitLyric(box) {
  const tate = box.querySelector('.tate');
  tate.style.fontSize = '';
  if (!box.clientHeight) return;
  const size = tate.getBoundingClientRect();
  const ratio = Math.min(1, (box.clientHeight - 16) / size.height, (box.clientWidth - 16) / size.width);
  if (ratio < 1) tate.style.fontSize = `${parseFloat(getComputedStyle(tate).fontSize) * ratio}px`;
}

// 下の句の最後の字（4つ目の値が true）は余韻の始まりに置く。余韻の3秒は最後の音そのものを含む（5-3-1-6 の余韻の数え方。根拠の資料は非公開の記録にある）。
// 下の句の中に置くと、最後の字を読み終えてからさらに3秒のばすように見える
function lineHtml(line) {
  const total = line.chars.reduce((sum, [, w = 1, , cue]) => sum + (cue ? 0 : w), 0);
  let seen = 0;
  const spans = line.chars.map(([ch, w = 1, ruby, cue]) => {
    let at = line.to;
    if (!cue) {
      at = line.at + ((line.to - line.at) * seen) / total;
      seen += w;
    }
    const cls = [ch === 'ー' ? 'nobi' : '', cue ? 'cue' : ''].filter(Boolean).join(' ');
    const body = ruby ? `<ruby>${ch}<rt>${ruby}</rt></ruby>` : ch;
    return `<span data-at="${at.toFixed(2)}"${cls ? ` class="${cls}"` : ''}>${body}</span>`;
  }).join('');
  return `<div class="ln${line.brk ? ' break' : ''}">${spans}${line.yoin ? YOIN : ''}</div>`;
}

function paintStage(root, t) {
  const assist = root.dataset.assist !== 'off';
  paintBand(root.querySelector('[data-band]'), t);
  const { phase, from } = phaseAt(t);
  let segFrom = 0;
  let seg = SEGMENTS.at(-1);
  let segLeft = 0;
  for (const s of SEGMENTS) {
    if (t >= segFrom && t < segFrom + s.sec) { seg = s; segLeft = segFrom + s.sec - t; }
    segFrom += s.sec;
  }
  const left = Math.max(phase.sec - (t - from), 0);
  const drain = root.querySelector('.drain');
  drain.dataset.seg = phase.key;
  drain.style.background = phase.fill;
  // 縮めると色の境目まで縮むので、上から切り取る
  drain.style.clipPath = `inset(${(1 - left / phase.sec) * 100}% 0 0 0)`;
  root.querySelector('.now b').textContent = assist ? phase.label : '補助なし';
  // 名前は「余韻と間」のまま、数字は余韻3秒と間1秒を別々に数える。4.0 から数えると余韻が4秒に見えるからである
  root.querySelector('.now span').innerHTML = phase.keys.length > 1 ? `<small>${seg.name}</small> ${segLeft.toFixed(1)}` : left.toFixed(1);
  root.querySelectorAll('[data-at]').forEach((el) => el.classList.toggle('on', assist && t > Number(el.dataset.at)));
}

function runClock(fn) {
  const startedAt = performance.now();
  let id = requestAnimationFrame(function tick(now) {
    if (fn((now - startedAt) / 1000) === false) return;
    id = requestAnimationFrame(tick);
  });
  const stop = () => cancelAnimationFrame(id);
  onDispose(stop);
  return stop;
}

// まず1回読む の導入。1段に1つずつ見せるものを増やす。毎回出ると鬱陶しいので、初回だけにする
const INTRO = [
  '競技かるたの読みには、5-3-1-6 というシンプルなルールがあります。',
  'このアプリでは、5-3-1-6 の感覚をつかむために、2つの仕組みを使います。',
  'お手本と一緒に、ルールを確かめてみましょう。',
  'では、読んでみませんか？',
];
const INTRO_KEY = 'yomimasu.introDone';

function introDone() {
  try { return localStorage.getItem(INTRO_KEY) === '1'; } catch { return false; }
}

function markIntroDone() {
  try { localStorage.setItem(INTRO_KEY, '1'); } catch { /* 覚えられなくても、次も導入が出るだけである */ }

function mountListen(el) {
  const say = el.querySelector('[data-say-line]');
  const points = el.querySelector('[data-intro-points]');
  const rule = el.querySelector('[data-intro-rule]');
  const pair = el.querySelector('[data-pair]');
  const stage = el.querySelector('[data-stage]');
  const controls = el.querySelector('[data-controls]');
  buildBand(rule.querySelector('[data-rule-band]'), { fixed: true });
  buildStage(stage);
  let stop = null;
  const halt = () => {
    stop?.();
    stop = null;
    paintStage(stage, 0);
  };
  const play = (onEnd) => {
    stop = runClock((t) => {
      if (t >= PAIR_SEC) { halt(); onEnd(); return false; }
      paintStage(stage, t);
    });
  };
  const button = (label, cls, onClick) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  };
  // 再生中にもう一度押すと止める。止めるのは打ち込まずにすぐ動かす
  const listenButton = (cls, onEnd) => {
    const b = button('お手本を聞く', cls, () => {
      if (stop) { halt(); b.textContent = 'お手本を聞く'; return; }
      act('お手本を聞く', () => {
        b.textContent = 'やめる';
        play(() => { b.textContent = 'お手本を聞く'; onEnd(); });
      });
    });
    return b;
  };
  const note = () => {
    const p = document.createElement('p');
    p.className = 'fine';
    p.textContent = '見本では音が出ません。お手本は、5-3-1-6 に最も近い読みを選んでいます。';
    return p;
  };

  const marks = [[stage.querySelector('[data-band]'), '①'], [stage.querySelector('.stage-body'), '②']];
  // withMotion はボタンで段を進めたとき。開いた直後は、画面全体の出し方に任せる
  function setStep(n, withMotion = false) {
    halt();
    const animate = withMotion && !reduced;
    const stageWasHidden = stage.hidden;
    say.textContent = INTRO[n - 1];
    points.hidden = n !== 2;
    marks.forEach(([target]) => target.classList.remove('is-marked'));
    if (n === 2) {
      // 「① 上の帯」の行が流れ始めたら上の帯を、「② 歌の後ろの色」の行で歌の後ろの色を囲む
      const items = [...points.querySelectorAll('li')];
      marks.forEach(([target, mark], i) => {
        target.dataset.mark = mark;
        const on = () => target.classList.add('is-marked');
        if (animate) items[i].addEventListener('streamstart', on, { once: true });
        else on();
      });
    }
    rule.hidden = n !== 1;
    pair.hidden = n === 1;
    stage.hidden = n === 1;
    stepEl.textContent = n < 4 ? `はじめに ${n} / 4` : ROUTES['/read/'].step;
    controls.replaceChildren();
    if (n === 2) {
      // 動きは自動で始めず、「確認する」で何度でも音なしで流せる。文を読む前に動き出すと、文と動きを同時に追うことになる
      const check = button('確認する', 'btn', () => {
        if (stop) { halt(); check.textContent = '確認する'; return; }
        act('確認する', () => {
          check.textContent = 'やめる';
          play(() => { check.textContent = 'もう一度確認する'; });
        });
      });
      controls.append(check);
    }
    if (n <= 2) {
      const next = button('次へ', 'btn btn--fill', () => act('次へ', () => setStep(n + 1, true)));
      controls.append(next);
      addBack(next);
    }
    if (n === 3) {
      const listen = listenButton('btn btn--fill', () => setStep(4, true));
      controls.append(listen, note());
      addBack(listen);
    }
    if (n === 4) {
      markIntroDone();
      const read = document.createElement('a');
      read.className = 'btn btn--fill';
      read.href = '#/read/rec/';
      read.textContent = '読んでみる';
      const again = button('はじめの説明をもう一度見る', 'link-btn', () => act('はじめの説明', () => setStep(1, true)));
      controls.append(listenButton('btn', () => {}), read, again, note());
      addBack(read);
      bindLinks(controls);
    }
    if (animate) {
      // 2段目は、歌の枠を先に出してから ①② を流す。①② は冒頭の文の続きとして流し、場所は取っておくので、枠は動かない
      const units = [];
      classify(say, units, true);
      if (n === 1) classify(rule, units);
      if (stageWasHidden && !stage.hidden) [pair, stage].forEach((el) => classify(el, units));
      if (n === 2) classify(points, units, true);
      classify(controls, units);
      markLead(units).forEach((u) => { if (points.contains(u.el)) u.instant = false; });
      streamUnits(units);
    }
  }
  setStep(introDone() ? 4 : 1);
}

const LIMIT_SEC = 25;
const KAMI_START_SEC = PAIR_SEC - SEGMENTS.at(-1).sec;
// 余韻で押す仕組み。押した時刻を余韻の始まりとして、そこから余韻3秒と間1秒を数え直す（2026-11-03〜04 のユーザーの判断）
const YOIN_START = SEGMENTS[0].sec;
const TAP_FROM = LYRICS[1].at; // 下の句の2行目より前の押し間違いは数えない
const TAP_UNTIL = YOIN_START + 2; // 余韻に入るのが遅い人も、標準で切り替わったあと2秒は合わせ直せる
const TAP_CHAR = 'る';
const REC_HELP_KEY = 'yomimasu.recHelpDone';

function recHelpDone() {
  try { return localStorage.getItem(REC_HELP_KEY) === '1'; } catch { return false; }
}

function markRecHelpDone() {
  try { localStorage.setItem(REC_HELP_KEY, '1'); } catch { /* 覚えられなくても、次も説明が出るだけである */ }
}

function recHelpHtml() {
  return `<b>読む前に</b>
    <p>「読み始める」を押すと、3・2・1 と数えます。数え終わったら読み始めてください。</p>
    <p>下の句の最後の「${TAP_CHAR}」を読む瞬間に、画面のどこかをタップしてください。</p>
    <p>余韻に入る時刻がガイドとずれると、余韻を無理にのばしたり、ずれたまま読み進めたりすることになります。タップすると、ガイドがあなたの余韻に合わせて数え直します。押さなくても、標準の時間で進みます。</p>
    <button class="btn" type="button" data-help-close>わかった</button>`;
}
const COUNT_FROM = 3;
const COUNT_BEAT_MS = 800;

function mountRec(el) {
  const stage = el.querySelector('[data-stage]');
  const controls = el.querySelector('[data-controls]');
  const tools = document.getElementById('tools');
  const retry = el.querySelector('[data-retry]');
  buildStage(stage);
  stage.dataset.tap = '';
  const body = stage.querySelector('.stage-body');
  const tapHint = document.createElement('div');
  tapHint.className = 'tap-hint';
  tapHint.hidden = true;
  tapHint.textContent = `画面のどこかを、「${TAP_CHAR}」でタップ`;
  const help = document.createElement('div');
  help.className = 'rec-help';
  help.innerHTML = recHelpHtml();
  help.hidden = recHelpDone();
  body.append(tapHint, help);
  help.querySelector('[data-help-close]').addEventListener('click', () => act('わかった', () => {
    help.hidden = true;
    markRecHelpDone();
  }));
  const run = el.querySelector('.run');
  const say = (text) => {
    const line = document.createElement('div');
    line.className = 'read';
    line.dataset.tapLine = '';
    line.textContent = `● ${text}`;
    run.append(line);
  };

  const setControls = (id) => {
    controls.replaceChildren(clone(id));
    controls.querySelectorAll(':scope > .btn--fill').forEach(addBack);
    bindLinks(controls);
  };

  function toIdle() {
    disposeAll();
    setBar(ROUTES['/read/rec/']);
    stage.querySelector('.count').hidden = true;
    stage.dataset.t = '0';
    paintStage(stage, 0);
    setControls('t-rec-idle');
    const assistOn = controls.querySelector('[data-assist-on]');
    const assistOff = controls.querySelector('[data-assist-off]');
    const setAssist = (on) => {
      stage.dataset.assist = on ? 'on' : 'off';
      assistOn.setAttribute('aria-pressed', String(on));
      assistOff.setAttribute('aria-pressed', String(!on));
      paintStage(stage, 0);
    };
    assistOn.addEventListener('click', () => act('補助あり', () => setAssist(true)));
    assistOff.addEventListener('click', () => act('補助を外す', () => setAssist(false)));
    setAssist(stage.dataset.assist !== 'off');
    controls.querySelector('[data-start]').addEventListener('click', () => act('読み始める', () => {
      help.hidden = true;
      markRecHelpDone();
      toCount();
    }));
    controls.querySelector('[data-help]').addEventListener('click', () => act('読み方の説明', () => { help.hidden = false; }));
    tapHint.hidden = true;
    run.querySelectorAll('[data-tap-line]').forEach((line) => line.remove());
    tools.hidden = false;
  }

  function showRecBar() {
    stepEl.innerHTML = '<span class="rec-state">録音中 <span data-elapsed>0:00</span></span>';
  }

  function toCount() {
    tools.hidden = true;
    showRecBar();
    setControls('t-rec-running');
    controls.querySelector('[data-cancel]').addEventListener('click', toIdle);
    controls.querySelector('[data-finish]').addEventListener('click', () => act('読み終えた', finish));
    const overlay = stage.querySelector('.count');
    overlay.hidden = false;
    let n = COUNT_FROM;
    overlay.textContent = n;
    const timer = setInterval(() => {
      n -= 1;
      if (n > 0) { overlay.textContent = n; return; }
      clearInterval(timer);
      overlay.hidden = true;
      toReading();
    }, COUNT_BEAT_MS);
    onDispose(() => clearInterval(timer));
    const opened = performance.now();
    const elapsed = stepEl.querySelector('[data-elapsed]');
    const tick = setInterval(() => {
      const s = Math.floor((performance.now() - opened) / 1000);
      elapsed.textContent = `0:${String(s).padStart(2, '0')}`;
    }, 250);
    onDispose(() => clearInterval(tick));
  }

  // 補助ありのときだけ、余韻の始まりで画面を押せる。押した瞬間に合わせ直し、打ち込みの間は置かない（置くと合わせる意味がなくなる）
  function toReading() {
    const finishButton = controls.querySelector('[data-finish]');
    const assist = stage.dataset.assist !== 'off';
    const startedAt = performance.now();
    const elapsed = () => (performance.now() - startedAt) / 1000;
    let tapAt = null;
    const guideTime = (t) => (tapAt === null || t < tapAt ? t : YOIN_START + (t - tapAt));
    const accepting = (t) => assist && tapAt === null && t >= TAP_FROM && t <= TAP_UNTIL;
    const onTap = (e) => {
      const t = elapsed();
      if (e.target.closest('button, a, .only-sample') || !accepting(t)) return;
      tapAt = t;
      const diff = t - YOIN_START;
      say(`余韻の入りをタップに合わせました（標準より ${Math.abs(diff).toFixed(2)}秒${diff < 0 ? '早い' : '遅い'}）`);
    };
    document.addEventListener('pointerdown', onTap);
    onDispose(() => document.removeEventListener('pointerdown', onTap));
    runClock(() => {
      const t = elapsed();
      const g = guideTime(t);
      paintStage(stage, Math.min(g, PAIR_SEC));
      tapHint.hidden = !accepting(t);
      if (g >= KAMI_START_SEC) finishButton.disabled = false;
      if (t >= LIMIT_SEC) { finish(); return false; }
    });
  }

  function finish() {
    disposeAll();
    go('/read/heard/');
  }

  toIdle();
  tools.querySelector('[data-denied]').addEventListener('click', () => {
    setControls('t-rec-denied');
    tools.hidden = true;
  });
  tools.querySelector('[data-retry-on]').addEventListener('click', () => {
    retry.hidden = !retry.hidden;
    el.querySelector('.run').hidden = !retry.hidden;
  });
  const leave = () => { if (document.hidden) toIdle(); };
  document.addEventListener('visibilitychange', leave);
  onDisposeLong(() => document.removeEventListener('visibilitychange', leave));
}

let listOrder = 'kimariji';
let listDir = 'desc';

function mountGrid(el) {
  const grid = el.querySelector('[data-grid]');
  const buttons = el.querySelectorAll('[data-order]');
  const dirs = el.querySelector('[data-dirs]');
  const dirButtons = dirs.querySelectorAll('[data-dir]');
  // 少ない順は札の数で並べ直す。同じ数の音どうしは一覧の順を保つ（sort は安定）
  const groups = () => (listDir === 'desc' ? LIST : [...LIST].sort((a, b) => a[1].length - b[1].length));
  // 歌番号は、歌番号順のときだけ並びの手がかりとして小さく添える
  const cell = ([no, kim]) => {
    const inner = `${listOrder === 'number' ? `<small>${no}番</small>` : ''}<b>${kim}</b>`;
    return CARDS[no] ? `<a href="#/karuta/${no}/">${inner}</a>` : `<span>${inner}</span>`;
  };
  const joka = '<div class="kim-grid"><span class="joka"><b>序歌</b></span></div>';
  const show = () => {
    buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.order === listOrder)));
    dirButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.dir === listDir)));
    dirs.hidden = listOrder !== 'kimariji';
    grid.innerHTML = joka + (listOrder === 'kimariji'
      ? groups().map(([head, cards]) => `<h3 class="group-head"><b>${head}</b><small>${cards.length}首</small></h3><div class="kim-grid">${cards.map(cell).join('')}</div>`).join('')
      : `<div class="kim-grid" style="margin-top:6px">${LIST.flatMap(([, cards]) => cards).sort((a, b) => a[0] - b[0]).map(cell).join('')}</div>`);
    bindLinks(grid);
  };
  buttons.forEach((b) => b.addEventListener('click', () => act(b.textContent, () => { listOrder = b.dataset.order; show(); })));
  dirButtons.forEach((b) => b.addEventListener('click', () => act(b.textContent, () => { listDir = b.dataset.dir; show(); })));
  show();
}

function setBar(route) {
  stepEl.textContent = route.step ?? '';
}

// 見本の中で開いた画面の順。ブラウザーの戻る操作と同じ向きに増減させる
const trail = [];
let backWithMotion = false;
const currentPath = () => location.hash.slice(1) || '/';

// どの操作も、先にターミナルへ打ち込んでから動かす。Claude Code でコマンドを送ってから動くのと同じ順にする。
// 打ち込まずにすぐ動かすのは、止める操作（やめる、キャンセル）だけである
function terminal() {
  const ask = out.querySelector('[data-ask]');
  if (ask) return { ask, target: ask.querySelector('[data-typed]') };
  // 入力の行がない画面（聞く、読む、一覧、練習モード）は、実行の行に打ち込む
  const run = out.querySelector('[data-run]');
  return run ? { target: run } : null;
}

async function reflect(text, { fresh = false } = {}) {
  if (reduced) return null;
  const term = terminal();
  if (!term) return null;
  term.ask?.classList.add('is-sent');
  term.target.textContent = fresh ? '' : COMMAND;
  const chars = [...text];
  for (const ch of chars) {
    term.target.textContent += ch;
    await wait(TYPE_MS / chars.length);
  }
  await wait(SEND_HOLD_MS);
  return term;
}

// 画面が変わらない操作のあとは、入力の行を空に戻す。実行の行は最後のコマンドを残す
function settle(term) {
  if (!term?.ask) return;
  term.ask.classList.remove('is-sent');
  term.target.textContent = COMMAND;
}

async function act(text, fn) {
  if (busy) return;
  busy = true;
  const term = await reflect(text);
  busy = false;
  fn();
  settle(term);
}

document.addEventListener('click', (e) => {
  const say = e.target.closest('[data-say]');
  if (say) act(say.dataset.say, () => {});
});

// 戻るは主の操作の右に細く置き、押すと行き先を尋ねる（AskUserQuestion の形）
function addBack(main) {
  if (!main || main.parentElement.classList.contains('main-row')) return;
  const row = document.createElement('div');
  row.className = 'main-row';
  main.replaceWith(row);
  const back = document.createElement('button');
  back.type = 'button';
  back.className = 'btn btn--line back';
  back.dataset.back = '';
  back.textContent = '戻る';
  row.append(main, back);
}

async function openBackAsk(back) {
  if (busy) return;
  // 主のボタン群を、質問の選択肢に置き換える。入力の行は打ち込んだコマンドを見せたまま残す
  const group = back.closest('[data-ask]') ?? back.closest('.controls, .next, .back-row');
  busy = true;
  const term = await reflect('戻る');
  busy = false;
  const prev = trail.at(-1);
  const prevRoute = prev && prev !== '/' ? ROUTES[prev] : null;
  // 行き先が入口しかないときは尋ねずに移る。入口へは履歴を戻って移るので、ブラウザーの進むで元の画面に戻れる
  if (!prevRoute) {
    if (prev === '/') {
      backWithMotion = !reduced;
      history.back();
      return;
    }
    trail.push(currentPath());
    history.pushState(null, '', '#/');
    render('/', { reveal: Boolean(term) });
    return;
  }
  const options = [
    ...(prevRoute ? [['prev', `1つ前のページ（${prevRoute.read ?? prevRoute.cmd}）`]] : []),
    ['top', 'トップページ'],
  ];
  const hidden = [...group.children].filter((c) => !c.classList.contains('ask-line'));
  hidden.forEach((c) => { c.hidden = true; });
  const box = document.createElement('div');
  box.className = 'auq';
  box.setAttribute('role', 'group');
  box.setAttribute('aria-label', 'どこに戻りますか？');
  box.innerHTML = '<p class="auq-q">どこに戻りますか？</p><div class="auq-opts">'
    + options.map(([to, label], i) => `<button class="btn" type="button" data-to="${to}" data-label="${label}">${i + 1}. ${label}</button>`).join('')
    + '<button class="btn btn--line" type="button" data-to="cancel">キャンセル</button></div>';
  group.append(box);
  if (!reduced) {
    const units = [];
    classify(box, units);
    await streamUnits(markLead(units));
  }
  box.querySelector('button').focus();
  box.addEventListener('click', async (e) => {
    const option = e.target.closest('[data-to]');
    if (!option || busy) return;
    if (option.dataset.to === 'cancel') {
      box.remove();
      hidden.forEach((c) => { c.hidden = false; });
      settle(term);
      back.focus();
      return;
    }
    // 選んだ答えをターミナルに出し、ひと呼吸置いてから移る
    busy = true;
    const answer = document.createElement('p');
    answer.className = 'auq-a';
    answer.textContent = `❯ ${option.dataset.label}`;
    box.replaceChildren(box.querySelector('.auq-q'), answer);
    if (!reduced) await wait(TYPE_MS + SEND_HOLD_MS);
    busy = false;
    if (option.dataset.to === 'prev') {
      backWithMotion = !reduced;
      history.back();
      return;
    }
    trail.push(currentPath());
    history.pushState(null, '', '#/');
    render('/', { reveal: !reduced });
  });
}

document.addEventListener('click', (e) => {
  const back = e.target.closest('[data-back]');
  if (back) openBackAsk(back);
});

function runHtml(route) {
  if (!route.cmd) return '';
  const read = route.read ? `<div class="read" data-line>● Read ${route.read}</div>` : '';
  const note = route.note ? `<div class="read" data-line>● ${route.note}</div>` : '';
  return `<div class="run"><div><span class="gt">&gt;</span> <span data-run>${COMMAND}${route.cmd}</span></div>${read}${note}</div>`;
}

function render(path, { reveal = false } = {}) {
  disposeAll();
  longDisposers.forEach((fn) => fn());
  longDisposers = [];
  const route = ROUTES[path] ?? ROUTES['/'];
  const screen = document.createElement('div');
  screen.className = `screen${route.full ? ' screen--stage' : ''}`;
  screen.innerHTML = runHtml(route);
  const body = clone(route.tpl);
  const rest = document.createElement('div');
  rest.style.display = 'contents';
  const tools = document.getElementById('tools');
  const toolsTpl = body.querySelector('template[data-tools]');
  tools.hidden = !toolsTpl;
  tools.replaceChildren(...(toolsTpl ? [toolsTpl.content.cloneNode(true)] : []));
  toolsTpl?.remove();
  rest.append(body);
  screen.append(rest);
  out.replaceChildren(screen);
  setBar(route);
  route.mount?.(screen);
  if (route !== ROUTES['/']) screen.querySelectorAll('.next > .btn--fill, .controls > .btn--fill').forEach(addBack);
  bindLinks(screen);
  scrollTo(0, 0);
  if (!reveal) return Promise.resolve();
  return revealStepwise(screen);
}

async function revealStepwise(screen) {
  const lines = [...screen.querySelectorAll('[data-line]')];
  const units = [];
  [...screen.children].forEach((c) => classify(c, units));
  markLead(units);
  lines.forEach((el) => el.classList.add('reveal'));
  prepareUnits(units);
  for (const line of lines) {
    await wait(REVEAL_STEP_MS);
    line.classList.remove('reveal');
  }
  await wait(REVEAL_STEP_MS);
  await playUnits(units);
}

// 冒頭の文のかたまりだけを Claude Code の出力のように数文字ずつ流し、残りはまとめて出す（2026-11-04 のユーザーの判断）。
// 本文を全部流すと、どの画面も1.5秒の上限に合わせて速く流れ、せかされる感じになった。
// 1秒に30字で、上限は設けない。60字では目で追えず、上限で速めると長い説明ほど速く流れてしまう（同日のユーザーの判断）。
// 途中を飛ばす操作は、操作感を試すあいだ付けない
const STREAM_CPS = 30;
const STREAM_FADE_MS = 70;
// まとめて出した枠が浮かび終えてから、次の文を流す
const STREAM_SHOW_MS = 150;
const streamOwner = new WeakMap();
// 1字ずつ流さず、まとめて出すもの。縦書きの歌や帯、ボタンは、1字ずつ出すとかえって読みにくい
const STREAM_ATOMIC = '.band, .stage, .btn, .ask-line, .play, svg, .menu > a, .kim-grid > *, .big-num, .tate, .tag, .link-btn, .link-inline, .main-row, [data-pair]';

function isInlineBox(el) {
  const d = getComputedStyle(el).display;
  return d.startsWith('inline') || d.startsWith('ruby') || d === 'none';
}

function textParts(el) {
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const parts = [];
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (n.nodeValue.trim()) parts.push([n, n.nodeValue]);
  }
  return parts;
}

// 出す単位に分ける。text は1字ずつ流す、fade はまとめて出す、box は枠だけ先に出して中身を順に出す。
// reserve は、出す前から場所を取っておく（見えないだけ）
function classify(el, units, reserve = false) {
  if (el.hidden || el.matches('template, script, .run')) return;
  const display = getComputedStyle(el).display;
  if (display === 'none') return;
  if (display === 'contents') { [...el.children].forEach((c) => classify(c, units, reserve)); return; }
  if (el.matches(STREAM_ATOMIC)) { units.push({ el, kind: 'fade', reserve }); return; }
  if ([...el.children].some((c) => !isInlineBox(c))) {
    units.push({ el, kind: 'box', reserve });
    [...el.children].forEach((c) => classify(c, units, reserve));
    return;
  }
  const parts = textParts(el);
  units.push(parts.length ? { el, kind: 'text', parts, reserve } : { el, kind: 'fade', reserve });
}

// 冒頭の文のかたまりは、最初の帯・枠・ボタンより上にある文である。大きな数字（5-3-1-6）は文として扱う。
// それより下は instant にして、まとめて出す
function markLead(units) {
  let lead = true;
  units.forEach((u) => {
    if (lead && !(u.kind === 'text' || (u.kind === 'box' && !u.el.matches('.card')) || u.el.matches('.big-num'))) lead = false;
    u.instant = !lead;
  });
  return units;
}

function prepareUnits(units) {
  units.forEach((u) => {
    if (!u.reserve) {
      u.el.classList.add('pending');
      if (u.kind === 'text' && !u.instant) u.parts.forEach(([n]) => { n.nodeValue = ''; });
      return;
    }
    if (u.kind === 'box') return;
    u.el.classList.add('reserved');
    // まだ出していない字を見えない字として残し、行の折り返しを最後の形のまま保つ
    if (u.kind === 'text' && !u.instant) {
      u.ghosts = u.parts.map(([n, v]) => {
        const ghost = document.createElement('span');
        ghost.className = 'ghost';
        ghost.textContent = v;
        n.nodeValue = '';
        n.after(ghost);
        return ghost;
      });
    }
  });
}

// 単位ごとに待つと1単位ごとに1フレームずつ遅れるので、1本の時計で全体の進みを決める
async function playUnits(units) {
  const token = {};
  units.forEach((u) => streamOwner.set(u.el, token));
  const msPerChar = 1000 / STREAM_CPS;
  // まとめて出すものは、外側の要素だけを浮かべる。入れ子の両方を浮かべると、動きが重なる
  const instantEls = new Set(units.filter((u) => u.instant).map((u) => u.el));
  const isRoot = (el) => { for (let a = el.parentElement; a; a = a.parentElement) if (instantEls.has(a)) return false; return true; };
  let at = 0;
  const plan = units.map((u, i) => {
    const total = u.kind === 'text' ? u.parts.reduce((s, [, v]) => s + v.length, 0) : 0;
    const from = at;
    if (!u.instant) at += u.kind === 'text' ? total * msPerChar : u.kind === 'fade' ? STREAM_FADE_MS : 0;
    else if (units[i + 1] && !units[i + 1].instant) at += STREAM_SHOW_MS;
    return { ...u, total, from, to: u.instant ? from : at, root: u.instant && isRoot(u.el), state: 'wait' };
  });
  const begin = performance.now();
  return new Promise((resolve) => {
    const tick = (now) => {
      const t = now - begin;
      let left = 0;
      for (const u of plan) {
        if (u.state === 'done') continue;
        // 途中で画面が替わったり、同じ所に次の段が流れ始めたりしたら、その単位は手放す
        if (!u.el.isConnected || streamOwner.get(u.el) !== token) { u.state = 'done'; continue; }
        if (t < u.from) { left += 1; continue; }
        if (u.state === 'wait') {
          u.state = 'run';
          u.el.classList.remove('pending', 'reserved');
          if (u.instant ? u.root : u.kind === 'fade') u.el.classList.add('fade-in');
          u.el.dispatchEvent(new CustomEvent('streamstart'));
        }
        if (u.kind === 'text' && !u.instant) showChars(u, t >= u.to ? u.total : Math.floor((t - u.from) / msPerChar) + 1);
        if (t >= u.to) {
          u.ghosts?.forEach((g) => g.remove());
          u.state = 'done';
        } else left += 1;
      }
      if (left === 0) { resolve(); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

async function streamUnits(units) {
  prepareUnits(units);
  await playUnits(units);
}

function showChars(u, count) {
  let left = count;
  u.parts.forEach(([n, v], i) => {
    const take = Math.min(v.length, left);
    left -= take;
    n.nodeValue = v.slice(0, take);
    if (u.ghosts?.[i]) u.ghosts[i].textContent = v.slice(take);
  });
}

let busy = false;
window.lastRunMs = null;

async function run(path, cmd, { fresh = false } = {}) {
  if (busy) return;
  busy = true;
  const started = performance.now();
  const text = cmd ?? ROUTES[path]?.cmd;
  const term = text ? await reflect(text, { fresh }) : null;
  trail.push(currentPath());
  history.pushState(null, '', `#${path}`);
  await render(path, { reveal: Boolean(term) });
  window.lastRunMs = Math.round(performance.now() - started);
  busy = false;
}

// 時間切れのように、利用者が押していない移動は打ち込まない
function go(path) {
  trail.push(currentPath());
  history.pushState(null, '', `#${path}`);
  render(path);
}

function bindLinks(root) {
  root.querySelectorAll('a[href^="#/"]').forEach((a) => {
    if (a.dataset.bound) return;
    a.dataset.bound = '1';
    a.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      const path = a.getAttribute('href').slice(1);
      if (path === '/') run('/', COMMAND.trim(), { fresh: true });
      else run(path, a.dataset.cmd);
    });
  });
}

addEventListener('popstate', () => {
  const path = currentPath();
  if (trail.at(-1) === path) trail.pop();
  const reveal = backWithMotion;
  backWithMotion = false;
  render(path, { reveal });
});
bindLinks(document);
render(location.hash.slice(1) || '/');
</script>
