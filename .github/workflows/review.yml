name: review

on:
  pull_request:
    branches: [main, production]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 人の PR は人が見るので、Claude の PR だけをレビューする。必須の検査では skip は成功として扱われる。
  review-gate:
    if: ${{ github.event.pull_request.user.login == 'claude[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # PR の内容を実行しないよう、base を取り出す。REVIEW.md とスキルも base の版が効く。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: レビューの回数を確かめる
        shell: bash
        run: |
          round=$(gh pr view "$PR" --json comments | bash .github/scripts/review-round.sh)
          if ((round > 3)); then
            echo "::error::レビューが3回で通らなかったので止めます。"
            gh pr edit "$PR" --add-label needs-human
            exit 1
          fi

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude[bot],github-actions[bot]
          prompt: /review-pr ${{ github.event.pull_request.number }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*)"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"integer"},"minor":{"type":"integer"},"existing":{"type":"integer"},"report":{"type":"string"}},"required":["blocking","minor","existing","report"]}'

      - name: 結果を PR に書き、次へ進める
        shell: bash
        env:
          OUTPUT: ${{ steps.review.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          { echo '<!-- review-gate -->'; echo; jq -r .report <<<"$OUTPUT"; } | gh pr comment "$PR" --body-file -
          bash .github/scripts/run-summary.sh "$EXECUTION_FILE" | gh pr comment "$PR" --body-file -

          if [[ $(jq -r .blocking <<<"$OUTPUT") != 0 ]]; then
            gh workflow run auto.yml -f pr="$PR"
            exit 1
          fi
          if jq -e 'index("go:merge")' <<<"$LABELS" >/dev/null; then
            gh pr merge "$PR" --auto --squash
          fi
